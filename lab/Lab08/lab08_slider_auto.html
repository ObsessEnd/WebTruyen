<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 08 - Bài 2: Auto Image Slider</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #6366f1;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --text-color: #f8fafc;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-color);
            overflow: hidden;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            text-align: center;
        }

        h1 {
            margin-bottom: 2rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 2.5rem;
        }

        .slider-wrapper {
            position: relative;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 12px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        .slider-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            border-radius: 16px;
            overflow: hidden;
        }

        .slides {
            display: flex;
            width: 100%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .slide {
            min-width: 100%;
            height: 100%;
        }

        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Navigation Buttons */
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(8px);
            transition: all 0.3s ease;
            z-index: 10;
        }

        .nav-btn:hover {
            background: var(--primary-color);
            border-color: var(--primary-color);
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.4);
            transform: translateY(-50%) scale(1.1);
        }

        .prev { left: 24px; }
        .next { right: 24px; }

        .nav-btn svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Dots Container */
        .dots-container {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 24px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .dot:hover {
            background: rgba(255, 255, 255, 0.5);
        }

        .dot.active {
            background: var(--primary-color);
            transform: scale(1.3);
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.6);
            border-color: rgba(255, 255, 255, 0.3);
        }

        /* Responsive */
        @media (max-width: 768px) {
            h1 { font-size: 1.8rem; }
            .nav-btn { width: 40px; height: 40px; }
            .prev { left: 12px; }
            .next { right: 12px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Auto Image Slider (2s)</h1>

        <div class="slider-wrapper">
            <div class="slider-container">
                <div class="slides" id="slides">
                    <div class="slide"><img src="img/slide_1.jpg" alt="Slide 1"></div>
                    <div class="slide"><img src="img/slide_2.jpg" alt="Slide 2"></div>
                    <div class="slide"><img src="img/slide_3.jpg" alt="Slide 3"></div>
                    <div class="slide"><img src="img/slide_4.jpg" alt="Slide 4"></div>
                    <div class="slide"><img src="img/slide_5.jpg" alt="Slide 5"></div>
                </div>

                <button class="nav-btn prev" id="prevBtn" onclick="plusSlides(-1)" aria-label="Previous Slide">
                    <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
                </button>
                <button class="nav-btn next" id="nextBtn" onclick="plusSlides(1)" aria-label="Next Slide">
                    <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
                </button>
            </div>
        </div>

        <div class="dots-container" id="dotsContainer">
            <span class="dot active" data-index="0" onclick="currentSlide(0)"></span>
            <span class="dot" data-index="1" onclick="currentSlide(1)"></span>
            <span class="dot" data-index="2" onclick="currentSlide(2)"></span>
            <span class="dot" data-index="3" onclick="currentSlide(3)"></span>
            <span class="dot" data-index="4" onclick="currentSlide(4)"></span>
        </div>
    </div>

    <script>
        const slides = document.getElementById('slides');
        const dots = document.querySelectorAll('.dot');
        
        let currentIndex = 0;
        const totalSlides = dots.length;

        function updateSlider() {
            // Move slides
            slides.style.transform = `translateX(-${currentIndex * 100}%)`;
            
            // Update dots
            dots.forEach((dot, index) => {
                dot.classList.toggle('active', index === currentIndex);
            });
        }

        // Chuyển đến slide tiếp theo hoặc trước đó
        function plusSlides(n) {
            currentIndex = (currentIndex + n + totalSlides) % totalSlides;
            updateSlider();
            resetTimer(); // Reset timer khi người dùng tự bấm
        }

        // Nhảy đến slide cụ thể khi bấm vào chấm tròn
        function currentSlide(n) {
            currentIndex = n;
            updateSlider();
            resetTimer();
        }

        // Tự động chuyển slide mỗi 2 giây
        let autoSlide = setInterval(() => {
            plusSlides(1);
        }, 2000);

        function resetTimer() {
            clearInterval(autoSlide);
            autoSlide = setInterval(() => {
                plusSlides(1);
            }, 2000);
        }

        // Hỗ trợ phím mũi tên
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') plusSlides(-1);
            if (e.key === 'ArrowRight') plusSlides(1);
        });
    </script>
</body>
</html>
