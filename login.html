<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập Admin - Thiên Đạo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    <style>
        body { background: linear-gradient(135deg, #2c3e50, #3498db); height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); width: 100%; max-width: 400px; }
    </style>
</head>
<body>

    <div class="login-card text-center">
        <img src="images/favicon-32x32.png" alt="Logo" width="60" height="60" class="mb-3 rounded-circle shadow-sm border">
        <h3 class="fw-bold text-primary mb-4">Thiên Đạo Quán</h3>
        
        <form id="login-form">
            <div class="input-group mb-3">
                <span class="input-group-text bg-light"><i class="fas fa-user text-muted"></i></span>
                <input type="text" id="username" class="form-control" placeholder="Tên đăng nhập" required>
            </div>
            <div class="input-group mb-4">
                <span class="input-group-text bg-light"><i class="fas fa-lock text-muted"></i></span>
                <input type="password" id="password" class="form-control" placeholder="Mật khẩu" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 fw-bold py-2 shadow-sm mb-3">ĐĂNG NHẬP ADMIN</button>
            <a href="index.html" class="text-decoration-none text-muted small"><i class="fas fa-arrow-left me-1"></i> Quay về trang chủ</a>
        </form>
    </div>

    <script>
        // Logic Đăng nhập đơn giản
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            if (user === 'admin' && pass === '123456') {
                localStorage.setItem('IS_LOGGED_IN', 'true');
                alert('Đăng nhập thành công! Chào mừng Quản trị viên.');
                window.location.href = 'dashboard.html';
            } else {
                alert('Tài khoản hoặc mật khẩu không chính xác!');
            }
        });
    </script>
</body>
</html>
